<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overgang · Ksyos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Inter+Tight:wght@700&display=swap">
<style>
:root{--ink:#473D3C;--soft:#6f6260;--pink:#E50376;--orange:#FE9E31;--line:#E4E2DD}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,Arial,sans-serif;font-size:17px;line-height:1.55}
main{max-width:880px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left,0px)) 64px}
img{height:30px}
h1{font-family:'Inter Tight',Arial,sans-serif;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;letter-spacing:-.02em;margin:36px 0 12px}
h1 span{color:var(--pink)}
p{color:var(--soft);margin:0 0 32px;max-width:40em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:grid;gap:6px;text-decoration:none;color:inherit;padding:24px;border-radius:16px;border:1px solid var(--line)}
a.card:hover{border-color:var(--ink)}
a.card.pt{background:#FFF7EB}a.card.ha{background:#FAF1F2}
a.card strong{font-family:'Inter Tight',Arial,sans-serif;font-size:1.4rem}
a.card span{color:var(--soft)}
</style>
</head>
<body>
<main>
<img src="img/ksyos-logo.png" alt="Ksyos">
<h1>Is dit de <span>overgang?</span></h1>
<p>Waaiers, kaarten en een vragenlijst om klachten rond de overgang te herkennen en te bespreken.</p>
<div class="cards">
<a class="card pt" href="patienten.html"><strong>Voor patiënten</strong><span>Herken klachten en bereid je afspraak voor.</span></a>
<a class="card ha" href="huisartsen.html"><strong>Voor huisartsen</strong><span>Signalen, verwijzen en de Greene-schaal.</span></a>
</div>
</main>
</body>
</html>
